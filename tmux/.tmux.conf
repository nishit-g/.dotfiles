# ---------- Basics ----------
set -g mouse on
set -g history-limit 10000

# Better colors & terminfo
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc,alacritty*:Tc"

# ---------- Prefix ----------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config
bind r source-file ~/.tmux.conf \; display-message "tmux reloaded"

# ---------- Splits ----------
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# ---------- Pane navigation (vim-style) ----------
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Resize panes with prefix + Shift + arrows
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ---------- Indexing ----------
set -g base-index 1
set -g pane-base-index 1

# ---------- Copy mode & macOS clipboard ----------
setw -g mode-keys vi

# Copy selection in copy-mode-vi with 'y' → macOS clipboard
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# ---------- Status bar ----------
set -g status-bg colour234
set -g status-fg white
set -g status-interval 5

set -g status-left-length 20
set -g status-right-length 60

set -g status-left ' #S '
set -g status-right ' %Y-%m-%d %H:%M '

# Active/inactive window styling
set -g window-status-current-format '#[bold][#I:#W]'
set -g window-status-format ' #I:#W '

# Pane borders
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour39

# Quickly switch to last window
bind Tab last-window

# Prefix + f → open project picker in a popup (advanced)
bind-key f display-popup -E "tmux-sessionizer"

# Optional: Prefix + F → run in full-screen pane instead of popup
bind-key F run-shell "tmux-sessionizer"

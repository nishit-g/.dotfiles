set -g mouse on
set -g history-limit 10000

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc,alacritty*:Tc"

unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind r source-file ~/.tmux.conf \; display-message "tmux reloaded"

bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

set -g base-index 1
set -g pane-base-index 1

setw -g mode-keys vi

bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

set -g status-bg colour234
set -g status-fg white
set -g status-interval 5

set -g status-left-length 20
set -g status-right-length 60

set -g status-left ' #S '
set -g status-right ' %Y-%m-%d %H:%M '

set -g window-status-current-format '#[bold][#I:#W]'
set -g window-status-format ' #I:#W '

set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour39

bind Tab last-window

# sesh integration (replaces tmux-sessionizer)
bind-key "f" run-shell "sesh connect \"$(
  sesh list -i | fzf-tmux -p 55%,60% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡ ' \
    --header '  ^a all ^t tmux ^x zoxide ^d kill' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡ )+reload(sesh list -i)' \
    --bind 'ctrl-t:change-prompt(🪟 )+reload(sesh list -t)' \
    --bind 'ctrl-x:change-prompt(📁 )+reload(sesh list -z)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡ )+reload(sesh list -i)'
)\""

bind-key "L" run-shell "sesh last"

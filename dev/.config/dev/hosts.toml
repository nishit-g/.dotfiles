# Dev Connection Manager - Host Configuration
# Run: dev (interactive) or dev <name> (direct)
# Edit: dev --edit

[hosts.mac-home]
host = "100.x.x.x"  # Your Mac's Tailscale IP (run: tailscale ip -4)
user = "your-username"
desc = "MacBook via Tailscale"
mosh = true


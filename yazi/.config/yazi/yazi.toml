[manager]
show_hidden = true
show_symlink = true
scrolloff = 5
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
linemode = "size"
ratio = [1, 3, 4]
title_format = "Yazi: {cwd}"

[preview]
wrap = "yes"
tab_size = 2
max_width = 2000
max_height = 1200
image_filter = "lanczos3"
image_quality = 80
image_delay = 50
cache_dir = ""

[opener]
edit = [
    { run = '${EDITOR:-nvim} "$@"', block = true, for = "unix" }
]
open = [
    { run = 'open "$@"', desc = "Open", for = "macos" }
]
reveal = [
    { run = 'open -R "$1"', desc = "Reveal in Finder", for = "macos" }
]
play = [
    { run = 'mpv --force-window "$@"', orphan = true, for = "unix" },
    { run = 'open "$@"', orphan = true, for = "macos" }
]
extract = [
    { run = 'unar "$1"', desc = "Extract here", for = "unix" }
]

[open]
rules = [
    { name = "*/", use = ["edit", "open", "reveal"] },
    { mime = "text/*", use = ["edit", "reveal"] },
    { mime = "image/*", use = ["open", "reveal"] },
    { mime = "video/*", use = ["play", "reveal"] },
    { mime = "audio/*", use = ["play", "reveal"] },
    { mime = "inode/x-empty", use = ["edit", "reveal"] },
    { mime = "application/json", use = ["edit", "reveal"] },
    { mime = "application/x-ndjson", use = ["edit", "reveal"] },
    { mime = "*/javascript", use = ["edit", "reveal"] },
    { mime = "application/{zip,gzip,x-tar,x-bzip*,x-7z-compressed,x-rar,x-xz}", use = ["extract", "reveal"] },
    { mime = "*", use = ["open", "reveal"] },
]

[tasks]
micro_workers = 10
macro_workers = 25
bizarre_retry = 5

[plugin]
prepend_previewers = []
append_previewers = []
prepend_fetchers = []
append_fetchers = []

# Termux Properties - Powerhouse Config
# Reload: termux-reload-settings

# === Extra Keys Row ===
# Two rows of extra keys for power users
extra-keys = [[ \
  {key: ESC, popup: {macro: "CTRL d", display: "exit"}}, \
  {key: CTRL, popup: {macro: "CTRL c", display: "^C"}}, \
  {key: ALT, popup: {macro: "CTRL z", display: "^Z"}}, \
  {key: TAB, popup: {macro: "CTRL r", display: "hist"}}, \
  {key: '/', popup: '~'}, \
  {key: '-', popup: '_'}, \
  {key: UP, popup: {macro: "CTRL p", display: "prev"}}, \
  {key: DOWN, popup: {macro: "CTRL n", display: "next"}} \
], [ \
  {key: 'q', popup: {macro: "CTRL q", display: "^Q"}}, \
  {key: 'w', popup: {macro: "CTRL w", display: "^W"}}, \
  {key: '|', popup: '&'}, \
  {key: HOME, popup: {macro: "CTRL a", display: "^A"}}, \
  {key: END, popup: {macro: "CTRL e", display: "^E"}}, \
  {key: PGUP, popup: {macro: "CTRL b", display: "pgup"}}, \
  {key: PGDN, popup: {macro: "CTRL f", display: "pgdn"}}, \
  {key: LEFT, popup: {macro: "ALT b", display: "word"}}, \
  {key: RIGHT, popup: {macro: "ALT f", display: "word"}} \
]]

# === Keyboard Behavior ===
# Use volume keys for extra functionality
volume-keys = volume

# Back key behavior
back-key = escape

# === Bell ===
# Visual bell only - no annoying sounds
bell-character = vibrate

# === Terminal Appearance ===
# Use custom colors.properties
use-black-ui = true

# Fullscreen mode
fullscreen = false

# Hide soft keyboard on startup
hide-soft-keyboard-on-startup = false

# === Session ===
# Auto-run command (handled by .zshrc instead)
# default-working-directory = /data/data/com.termux/files/home

# === Performance ===
# Terminal transcript rows (higher = more scrollback)
terminal-transcript-rows = 10000

# Reduce cursor blink for battery
terminal-cursor-blink-rate = 600

# === Security ===
# Allow external apps to execute termux commands
allow-external-apps = true
